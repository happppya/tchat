<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400..900&display=swap');

    body {
      height: 100%;
      margin: 0px;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      background: #1e1e24
    }

    .page-container {
      height: 100vh;
      overflow: hidden;
      display: flex;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 0px;
      margin: 8px 8px 8px 0px;
    }

    ::selection {
      background-color: #8d8dca;
      color: #ffffff;
    }

    .title-text {
      color: #e3e3ff;
      padding: 0px 20px;
      font-size: 30px;
      font-family: 'Rubik', sans-serif;
      font-weight: 300;
    }

    #message {
      width: 100%;
      min-height: 40px;
      height: 40px;
      max-height: 200px;
      box-sizing: border-box;
      padding: 11px 14px 9px 14px;
      border: 1px solid #6c6c80;
      border-radius: 10px;
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.2;
      background: #393946;
      color: #8e8ea8;
      resize: none;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #message:focus {
      border-color: #8080d6;
      box-shadow: 0 0 0 3px rgba(121, 121, 184, 0.15);
    }

    #message::placeholder {
      color: #8e8ea8;
    }

    .top-bar {
      display: flex;
      margin-bottom: 8px;
    }

    .groupchat-title-bar {
      flex: 1;
      font-size: 22px;
      font-weight: 600;
      color: #e3e3ff;
      padding: 0px 10px;
    }

    .side-bar {
      display: flex;
      flex-direction: column;
      width: 250px;
      background: #393946;
      border: 1px solid #6c6c80;
      border-radius: 10px;
      margin: 8px;
    }

    .side-bar ul {
      list-style: none;
      padding: 20px;
    }

    #createGcDropdownButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      cursor: pointer;
      border: none;
      background: #9b9bb800;
      color: #ababca;
      padding: 8px;
    }

    #createGcDropdownButton::after {
      display: inline-flex;
      content: "";
      transform: translateY(-7%) translateX(35%);
      border: 5px solid transparent;
      border-left-color: #ababca;
      /* Change arrow color here */
    }

    #createGcDropdownButton.isToggled::after {
      border-left-color: transparent;
      transform: translateY(20%) translateX(20%);
      border-top-color: #ababca;
    }

    #groupchatId {
      margin: 0px 8px;
      border: 1px solid #76768d;
      border-radius: 10px;
      padding: 5px;
      background: #606075;
      color: #ababca;
    }

    #groupchatId::placeholder {
      color: #808097;
    }

    #groupchatId.error::placeholder {
      color: red;
    }

    #groupchatId::-webkit-outer-spin-button,
    #groupchatId::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #groupchatId:focus {
      outline: none;
    }

    .gc-button {
      cursor: pointer;
      display: block;
      width: 100%;
      padding: 5px;
      margin: 4px 0;
      border: none;
      background: #393946;
      border-radius: 10px;
      color: #8e8ea8;
      text-align: left;
      font-family: Inter, Arial, sans-serif;
      font-size: 15px;
    }

    .gc-button:hover {
      background: #595965;
    }

    .gc-button.current-gc {
      background: #595965;
      font-weight: bold;
    }

    .gc-button-id-display {
      padding-left: 5px;
      font-size: 11px;
      font-style: italic;
      opacity: 0.7;
    }

    #displayName {
      margin-left: auto;
      width: 100px;
      height: 28px;
      box-sizing: border-box;
      color: #8e8ea8;
      padding: 5px 9px;
      justify-content: flex-end;
      border: 1px solid #6c6c80;
      border-radius: 10px;
      background: #393946;
      font-family: Inter, Arial, sans-serif;
      font-size: 12px;
      outline: none;
    }

    #displayName:focus {
      border-color: #8080d6;
      box-shadow: 0 0 0 2px rgba(121, 121, 184, 0.15);
    }

    #displayName::placeholder {
      color: #8e8ea8;
    }

    #errorMessage {
      margin-left: auto;
      color: red;
      padding: 7px 10px;
      font-family: Inter, Arial, sans-serif;
      font-size: 12px;
    }

    .button-container {
      padding: 10px 0px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      width: 100%;
      height: 30px;
      box-sizing: border-box;
      border: 1px solid #6c6c80;
      background: #393946;
      color: #8e8ea8;
      border-radius: 10px;
      font-family: Inter, Arial, sans-serif;
      font-size: 12px;
    }

    .composer {
      position: relative;
    }

    .message-row {
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }

    #message {
      flex: 1;
    }

    .gif-picker {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 240px;
      height: 320px;
      padding: 10px;
      background: white;
      border: 1px solid #d9dce1;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .gif-picker.open {
      display: block;
    }

    #gifSearch {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d9dce1;
      border-radius: 7px;
      outline: none;
      margin-bottom: 8px;
    }

    #gifResults {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      height: 260px;
      overflow-y: auto;
    }

    .gif-result {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
    }

    .gif-result:hover {
      opacity: 0.8;
    }

    .gif-preview-button {
      border: none;
      padding: 0;
      border-radius: 5px;
    }

    .gif-preview-button:hover {
      filter: brightness(70%);
    }

    .gif-preview {
      border-radius: 5px;
      display: block;
    }

    .messaging-window {
      flex: 1;
      margin-top: 16px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .messaging-window::-webkit-scrollbar {
      display: none;
    }

    .message-item {
      background: #393946;
      border: 1px solid #6c6c80;
      border-radius: 8px;
      color: #8e8ea8;
      padding: 8px 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message-time {
      font-size: 11px;
      color: #6c6c80;
      margin-left: 8px;
    }

    .hidden {
      display: none !important;
    }

    .placeholder-text {
      flex: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      text-align: center;
      align-items: center;
      flex-direction: column;
      height: 100%;
      color: #8e8ea860;
      font-size: 15px;
      margin-top: 10px;
    }

    .placeholder-text h2 {
      margin-top: 100px;
    }

    .gc-create-options {
      display: flex;
      flex-direction: column;
    }

    #createGcIdField {
      margin: 0px 8px;
      border: 1px solid #76768d;
      border-radius: 10px;
      padding: 5px;
      background: #606075;
      color: #ababca;
    }

    #createGcIdField::placeholder {
      color: #808097;
    }

    #createGcNameField {
      margin: 5px 8px;
      border: 1px solid #76768d;
      border-radius: 10px;
      padding: 5px;
      background: #606075;
      color: #ababca;
    }

    #createGcNameField::placeholder {
      color: #808097;
    }

    #createGcIdField::-webkit-outer-spin-button,
    #createGcIdField::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #createGcIdField:focus {
      outline: none;
    }

    #createGcNameField:focus {
      outline: none;
    }

    #createGcButton {
      cursor: pointer;
      border: 1px solid #c5c5e9;
      background: #9b9bb8;
      color: #2a2a35;
      margin: 0px 8px;
      border-radius: 10px;
      padding: 5px;
    }

    hr {
      border: none;
      background: #606075;
      height: 1px;
      width: 200px;
    }

    .toggle-sidebar-btn {
      cursor: pointer;
      height: 50px;
      width: 50px;
      font-size: 30px;
      color: #ababca;
      border: none;
      background: transparent;
      padding: 0px 0px 4px 0px;
      margin: 4px;
    }
  </style>
  <title>Chat</title>
</head>

<body>
  <div class="page-container">
    <div id="sideBar"class="side-bar">
      <h1 class="title-text">Chat </h1>
      <button id="createGcDropdownButton">Create Group Chat</button>
      <div id="gcCreateOptions" class="gc-create-options hidden">
        <input id="createGcIdField" type="number" placeholder="id">
        <input id="createGcNameField" type="text" placeholder="name">
        <button id="createGcButton">Create</button>
      </div>
      <hr>
      <input id="groupchatId" type="number" name="gc_id" placeholder="Room Code">
      <ul id="savedChats">
      </ul>
    </div>
    <button id="toggleSidebar" class="toggle-sidebar-btn">☰</button>
    <div id="placeholder_text" class="placeholder-text">
      <h1>Select a Group Chat to start messaging...</h1>
      <h2>(main gc: 1234)</h2>
    </div>
    <div id="main_content" class="main-content hidden">
      <div class="top-bar">
        <h1 id="groupchatTitle" class="groupchat-title-bar">Group Chat</h1>
        <span id="errorMessage"></span>
        <input id="displayName" type="text" placeholder="Display Name" maxlength="30">
      </div>
      <div class="composer">
        <div class="message-row">
          <textarea id="message" placeholder="Message..."></textarea>
        </div>
        <div class="button-container">
          <button class="btn">Upload files</button>
          <button class="btn" id="gifButton">Browse GIFs</button>
        </div>
        <div class="gif-picker" id="gifPicker">
          <input id="gifSearch" type="text" placeholder="Search GIFs...">
          <div id="gifResults"></div>
        </div>
        <div class="selected-gif-preview" id="selectedGifPreview"></div>
      </div>
      <div class="messaging-window" id="messagingWindow">
      </div>
    </div>
  </div>
  <script>
    function hasNonAscii(str) {
      const regex = /[^\x00-\x7F]/;
      return regex.test(str);
    }
    let currentGroupChatId = null;
    const gifButton = document.getElementById("gifButton");
    const gifPicker = document.getElementById("gifPicker");
    const gifSearch = document.getElementById("gifSearch");
    const gifResults = document.getElementById("gifResults");
    const selectedGifPreview = document.getElementById("selectedGifPreview");
    const box = document.getElementById("message");
    const displayNameField = document.getElementById("displayName");
    const errorDisplayText = document.getElementById("errorMessage");
    const placeholderText = document.getElementById("placeholder_text");
    const mainContent = document.getElementById("main_content");
    const sideBar = document.getElementById("sideBar");
    const groupchatIdField = document.getElementById("groupchatId");
    const savedChatList = document.getElementById("savedChats");
    const createGcDropdownButton = document.getElementById("createGcDropdownButton");
    const gcCreateOptions = document.getElementById("gcCreateOptions");
    const createGcIdField = document.getElementById("createGcIdField");
    const createGcNameField = document.getElementById("createGcNameField");
    const toggleSidebarButton = document.getElementById("toggleSidebar");
    try {
      const savedName = localStorage.getItem("displayName");
      if (savedName) displayNameField.value = savedName.slice(0, 30);
    } catch (e) {
      console.error(e);
    }

    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          console.log("Notification permission accepted.");
        }
      });
    }

    const messagingWindow = document.getElementById("messagingWindow");

    function formatTimestamp(timestampStr) {
  if (!timestampStr) return "";

  const utcTimestamp = timestampStr.includes("T")
    ? `${timestampStr}Z`
    : `${timestampStr.replace(" ", "T")}Z`;

  const date = new Date(utcTimestamp);

  if (isNaN(date.getTime())) return "";

  return new Intl.DateTimeFormat(undefined, {
    dateStyle: "short",
    timeStyle: "short"
  }).format(date);
}

    const socketProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${socketProtocol}//${location.host}/ws`);
    socket.addEventListener('open', () => {
      console.log('Connected to WebSocket server');

      pingInterval = setInterval(() => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'ping' }));
        }
      }, 30000); // Send ping every 30 seconds
    });

    socket.addEventListener('message', async (event) => {
      console.log("Message received: ", event.data);
      const incomingMessage = JSON.parse(event.data);

      if (incomingMessage.type == 'message' && getGcList().some(gc => gc.id == incomingMessage.groupChatId)) {
        const msgText = incomingMessage.messageText;
        if (incomingMessage.groupChatId == currentGroupChatId) renderSingularNewMessage(incomingMessage);
        errorMessage.innerHTML = "";
        const gcInfo = await getGCInfo(incomingMessage.groupChatId);

        if (document.hidden) {
          if (Notification.permission == "granted") {
            const notificationOptions = {
              body: (msgText == msgText.slice(0, 40) ? msgText : msgText.slice(0, 40) + "..."),
              tag: incomingMessage.timestamp,
              silent: false
            };
            console.log("tried notification");

            let notification = new Notification(incomingMessage.displayNameText + ` (${gcInfo.name})`, notificationOptions);

            notification.onclick = function (event) {
              event.preventDefault();
              window.focus();
              notification.close();
              console.log("notification closed");
            }
          }
        }
      } else if (incomingMessage.type == "error") {
        console.error(incomingMessage.messageText);
        errorDisplayText.innerHTML = incomingMessage.messageText;
      } else if (incomingMessage.type != "pong") {
        console.log("huh?", incomingMessage);
      }
    });

    function sendWSMessage(data) {
      socket.send(data);
    }

    function renderMessages(messages) {
      messagingWindow.innerHTML = "";

      messages.forEach((msg) => {
        const msgBox = document.createElement("div");
        msgBox.className = "message-item";

        const name = document.createElement("strong");
        name.textContent = (msg.display_name || "Unknown") + ": ";

        const text = document.createElement("span");
        text.textContent = msg.message_text || "";

        const time = document.createElement("span");
        time.className = "message-time";
        const timestamp = msg.sent_at;
        time.textContent = timestamp ? " (" + formatTimestamp(timestamp) + ")" : "";

        msgBox.appendChild(name);
        msgBox.appendChild(text);
        msgBox.appendChild(time);
        const gifEl = createGifElement(msg.gif_url);
        if (gifEl) {
          msgBox.appendChild(gifEl);
        }
        messagingWindow.appendChild(msgBox);
      });
    }

    createGcDropdownButton.onclick = function () {
      if (gcCreateOptions.classList.contains('hidden')) {
        gcCreateOptions.classList.remove('hidden');
        createGcDropdownButton.classList.add('isToggled');
      } else {
        gcCreateOptions.classList.add('hidden');
        createGcDropdownButton.classList.remove('isToggled');
      }
    }

    createGcButton.onclick = async function () {
      const gc = JSON.stringify({ id: createGcIdField.value, name: createGcNameField.value });
      const response = await fetch(`/api/createGC`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: gc
      });

      if (response.ok) {
        console.log("Group chat created successfully");
        getMessages(createGcIdField.value);
        addGcToStorage(createGcIdField.value, createGcNameField.value);
        renderGcButton(createGcIdField.value, createGcNameField.value);
        currentGroupChatId = createGcIdField.value;
        createGcIdField.value = "";
        createGcNameField.value = "";
        gcCreateOptions.classList.add('hidden');
        createGcDropdownButton.classList.remove('isToggled');
      } else {
        console.error("Failed to create group chat");
      }
    }

    toggleSidebarButton.onclick = function () {
      if (sideBar.classList.contains('hidden')) {
        sideBar.classList.remove('hidden');
      } else {
        sideBar.classList.add('hidden');
      }
    }

    function getGcList() {
      let savedGCs = JSON.parse(localStorage.getItem("savedGCList"));
      return savedGCs;
    }

    function addGcToStorage(groupChatId, groupChatName) {
      const gc = {
        id: groupChatId,
        name: groupChatName
      };
      let savedGCs = JSON.parse(localStorage.getItem("savedGCList"));
      if (savedGCs) {
        const index = savedGCs.findIndex(item => item.id == groupChatId);
        if (index !== -1) {
          savedGCs.splice(index, 1);
        }
        savedGCs.push(gc);
      } else {
        savedGCs = [gc];
      }
      localStorage.setItem("savedGCList", JSON.stringify(savedGCs));
    }

    function removeGcFromStorage(groupChatId) {
      let savedGCs = JSON.parse(localStorage.getItem("savedGCList"));
      if (savedGCs) {
        const index = savedGCs.findIndex(item => item.id == groupChatId);
        if (index !== -1) {
          savedGCs.splice(index, 1);
          localStorage.setItem("savedGCList", JSON.stringify(savedGCs));
        }
      }
    }

    function highlightGcButton(groupChatButton) {
      const highlightedButton = document.querySelector(".gc-button.current-gc");
      if (highlightedButton) {
        highlightedButton.classList.remove("current-gc");
      }
      groupChatButton.classList.add("current-gc");
    }

    function renderGcButton(groupChatId, groupChatName, highlighted=true) {
      const existingGcButton = document.getElementById(String(groupChatId));
      if (existingGcButton) existingGcButton.remove();
      const gcButton = document.createElement("li");
      gcButton.onclick = async function () {
        const gcInfo = await getGCInfo(groupChatId);

        if (gcInfo.error) {
          showError("Invalid Room!");
          gcButton.remove();
          removeGcFromStorage(groupChatId);
          return;
        }
        highlightGcButton(gcButton);
        getMessages(groupChatId);
        currentGroupChatId = groupChatId;
      }

      gcButton.textContent = groupChatName + " ";
      const idText = document.createElement("span");
      idText.className = "gc-button-id-display";
      idText.textContent = `(#${groupChatId})`;
      gcButton.appendChild(idText);

      gcButton.className = "gc-button";
      if (highlighted) {
        highlightGcButton(gcButton);
      }

      gcButton.id = String(groupChatId);
      savedChatList.prepend(gcButton);
    }

    function clearAllGCs() {
      localStorage.removeItem("savedGCList");
      savedChatList.innerHTML = "";
    }

    function renderAllSavedGCs() {
      let savedGCs = JSON.parse(localStorage.getItem("savedGCList"));
      if (savedGCs) {
        savedGCs.forEach((gc) => {
          renderGcButton(gc.id, gc.name, false);
        });
      }
    }
    renderAllSavedGCs();

    function createGifElement(gifUrl) {
      if (!gifUrl) return null;
      const img = document.createElement("img");
      img.src = gifUrl;
      img.style.maxWidth = "200px";
      img.style.display = "block";
      img.style.marginTop = "6px";
      img.style.borderRadius = "8px";
      return img;
    }

    function renderSingularNewMessage(msg) {
      const msgBox = document.createElement("div");
      msgBox.className = "message-item";

      const name = document.createElement("strong");
      name.textContent = (msg.displayNameText || "Unknown") + ": ";

      const text = document.createElement("span");
      text.textContent = msg.messageText || "";

      const time = document.createElement("span");
      time.className = "message-time";
      const timestamp = msg.timestamp;

      time.textContent = timestamp ? " (" + formatTimestamp(timestamp) + ")" : "";

      msgBox.appendChild(name);
      msgBox.appendChild(text);
      msgBox.appendChild(time);
      const gifEl = createGifElement(msg.gifUrl);
      if (gifEl) msgBox.appendChild(gifEl);
      messagingWindow.prepend(msgBox);
    }

    function togglePlaceholder(placeholderEnable = true) {
      if (!placeholderEnable) {
        placeholderText.classList.add("hidden");
        mainContent.classList.remove("hidden");
      } else {
        placeholderText.classList.remove("hidden");
        mainContent.classList.add("hidden");
      }
    }

    async function getGCInfo(groupChatId) {
      const groupchatInfoResponse = await fetch(`/api/getGCInfo?groupChatId=${Number(groupChatId)}`);
      const groupchatInfo = await groupchatInfoResponse.json();
      return groupchatInfo;
    }

    async function showError(errorMessage) {
      togglePlaceholder(true);
      groupchatIdField.value = "";
      groupchatIdField.placeholder = errorMessage;
      groupchatIdField.classList.add("error");
      setTimeout(() => {
        groupchatIdField.placeholder = "Room Code";
        groupchatIdField.classList.remove("error");
      }, 667);
    }

    async function getMessages(groupChatId, numMessages = 20) {
      try {
        const response = await fetch(`/api/getMessages?groupChatId=${Number(groupChatId)}&numMessages=${numMessages}`);

        const data = await response.json();
        if (!response.ok) {
          showError("Invalid Room!");

          throw new Error('Failed to fetch messages');
        }

        togglePlaceholder(false);

        const messages = data;

        groupchatInfo = await getGCInfo(groupChatId);
        const savedGCs = getGcList();
        if (!savedGCs || !savedGCs.some(gc => gc.id == groupChatId)) {
          addGcToStorage(groupChatId, groupchatInfo.name);
          renderGcButton(groupChatId, groupchatInfo.name);
        }

        renderMessages(messages);
        groupchatTitle.textContent = groupchatInfo.name || "Group Chat";
        return messages;
      } catch (error) {
        console.error(error);
      }
    }

    displayNameField.addEventListener("input", (event) => {
      event.target.value = event.target.value.replace(/[^\x00-\x7F]/g, '');
      try {
        localStorage.setItem("displayName", displayNameField.value.slice(0, 30));
      } catch (e) {
        console.error(e);
      }
    });

    let selectedGif = null;
    gifButton.addEventListener("click", () => {
      gifPicker.classList.toggle("open");
      if (gifPicker.classList.contains("open")) {
        gifSearch.focus();
        searchGifs("trending");
      }
    });

    gifSearch.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        searchGifs(gifSearch.value.trim());
      }
    });

    function appendGifToMessage(container, gifUrl) {
      if (gifUrl) {
        const gifImg = document.createElement("img");
        gifImg.src = gifUrl;
        gifImg.className = "message-gif";
        gifImg.style.maxWidth = "200px";
        gifImg.style.display = "block";
        gifImg.style.marginTop = "6px";
        gifImg.style.borderRadius = "6px";
        container.appendChild(gifImg);
      }
    }

    async function searchGifs(query) {
      if (!query) return;

      try {
        const response = await fetch(`/api/searchGifs?query=${encodeURIComponent(query)}`);
        const data = await response.json();
        gifResults.innerHTML = "";
        if (!data.data || data.data.length === 0) {
          gifResults.innerHTML = "<p style='color:#8e8ea8; padding:8px;'>No GIFs found.</p>";
          return;
        }

        // Loop through the array of GIFs
        data.data.forEach((gif) => {
          const img = document.createElement("img");
          img.src = gif.images.fixed_width_small.url;
          img.alt = gif.title || "GIF";
          img.className = "gif-result";

          // Click event to select a GIF
          img.addEventListener("click", () => {
            selectedGif = {
              id: gif.id,
              url: gif.images.original.url
            };

            // Render selected preview
            selectedGifPreview.innerHTML = "";

            const previewButton = document.createElement("button");
            previewButton.className = "gif-preview-button";
            previewButton.addEventListener("click", () => {
              selectedGif = null;
              selectedGifPreview.innerHTML = "";
            });

            const preview = document.createElement("img");
            preview.src = gif.images.fixed_width_small.url;
            preview.alt = gif.title || "GIF";
            preview.className = "gif-preview";

            previewButton.appendChild(preview);
            selectedGifPreview.appendChild(previewButton);

            // Close the picker dropdown
            gifPicker.classList.remove("open");

            // Focus back on the message box
            box.focus();
          });

          gifResults.appendChild(img);
        });
      } catch (error) {
        console.error("Failed to load GIFs:", error);
      }
    }

    box.addEventListener("keydown", async function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        const message = box.value.trim();
        if (message === "" && !selectedGif) {
          return;
        }
        box.value = "";
        const displayName = displayNameField.value.trim();

        const payload = {
          type: 'message',
          groupChatId: currentGroupChatId,
          messageText: message,
          displayNameText: displayName,
          gifUrl: selectedGif ? selectedGif.url : null // ok giovan i added it
        };

        const groupchatInfo = await getGCInfo(currentGroupChatId);
        if (groupchatInfo.error || !currentGroupChatId || !groupchatInfo.name) {
          console.log("error");
          return;
        }
        addGcToStorage(currentGroupChatId, groupchatInfo.name);
        renderGcButton(currentGroupChatId, groupchatInfo.name);
        sendWSMessage(JSON.stringify(payload));
        selectedGif = null;
        selectedGifPreview.innerHTML = "";
      }
    });

    box.addEventListener("input", function () {
      this.style.height = "40px";
      this.style.height = (this.scrollHeight + 2 > 40 ? this.scrollHeight + 2 : 40) + "px";
    });

    groupchatIdField.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        const groupChatId = groupchatIdField.value.trim();
        if (groupChatId === "") {
          return;
        }
        currentGroupChatId = groupChatId;
        getMessages(groupChatId);
      }
    });
  </script>
