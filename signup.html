<!DOCTYPE html>
<html>

<head>
    <style>
        .login-box {
            display: flex;
            justify-content: center;
            border: 1px solid;
            border-radius: 10px;
            flex-direction: column;
            width: 300px;
            padding: 10px;
            gap: 5px;
        }

        input {
            padding: 4px;
            font-family: Inter, Arial, sans-serif;
            border: 1px solid;
            border-radius: 5px;
        }

        button {
            padding: 4px;
            font-family: Inter, Arial, sans-serif;
            border: 1px solid;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <input type="text" id="usernameBox" name="username" placeholder="Username">
        <input type="email" id="emailBox" name="email" placeholder="Email Address">
        <input type="password" id="passwordBox" name="password" placeholder="Password">
        <input type="password" id="passwordConfirmBox" name="passwordConfirm" placeholder="Confirm Password">
        <button id="signUpButton">Sign Up</button>
        <button id="submitButton">Log In</button>
    </div>
</body>

</html>
